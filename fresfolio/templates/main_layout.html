<!DOCTYPE html>
<html>

    <head>
        <!-- APP CSS -->
        <link rel="stylesheet" href="{{url_for('static', filename='css/app.css')}}">

        <!-- QUASAR PRODUCTION CSS -->
        <link rel="stylesheet" href="{{url_for('static', filename='css/quasar.prod.css')}}">

        <script src="{{ url_for('static', filename='js/katex.min.js') }}"></script>

        <title>APP</title>

    <body>

        <script type="text/javascript" src="{{url_for('static', filename='js/quasar.umd.prod.js')}}"></script>

            window.vg = vg;

        <!-- VUE JS EXPOSE-LAYOUTS -->
        <script type="text/javascript" src="{{url_for('static', filename='js/vue_assets/vue_app.js')}}"></script>
        
        <!-- ACE JS -->
        <script src="{{url_for('static', filename='ace_builds/src/ace.js')}}" type="text/javascript" charset="utf-8"></script>
        <script src="{{url_for('static', filename='ace_builds/src/keybinding-vim.js')}}" type="text/javascript" charset="utf-8"></script>
