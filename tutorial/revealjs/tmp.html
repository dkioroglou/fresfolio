<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>reveal.js</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reset.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">
		<style>
			.subtitles {
				position: fixed;
				bottom: 20px;
				left: 50%;
				transform: translateX(-50%);
				background: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 15px 30px;
				border-radius: 8px;
				max-width: 80%;
				text-align: center;
				font-size: 1.2em;
				opacity: 0;
				transition: opacity 0.5s ease-in-out;
				z-index: 100;
			}
			.subtitles.visible {
				opacity: 1;
			}
		</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
                <section>
                    <h2>Welcome</h2>
                    <button id="start-btn" style="padding: 12px 24px; font-size: 1.2em; border-radius: 8px; cursor: pointer;">
                        Press to start
                    </button>
                </section>
				
				<section id="slide-fresfolio" data-autoslide="12000">
                    <h2>Fresfolio</h2>
                    <audio class="slide-audio" preload="auto">
                        <source src="assets/audio/title_slide.mp3" type="audio/mp3" />
                    </audio>
                    <div class="slide-subtitle" style="display: none;">
                        Welcome. This is a tutorial of fresfolio, a browser-based app designed to help you organize and track your research projects.
                    </div>
                </section>
				
				<section id="slide-contents">
                    <h2>Tutorial contents</h2>
                    <audio class="slide-audio" preload="auto">
                        <source src="assets/audio/slide_1.mp3" type="audio/mp3" />
                    </audio>
                    <div class="slide-subtitle" style="display: none;">
                        These are the subtitles for slide 1.
                    </div>
                </section>
			</div>
		</div>
		
		<!-- Global subtitle display -->
		<div id="subtitle-display" class="subtitles"></div>
		
		<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
		<script>
			Reveal.initialize({
				hash: true,
                width: "100%",
                height: "100%",
                autoSlide: 0,
				plugins: []
			});
		</script>
        
		<script>
            let slideTimer = null;
            const subtitleDisplay = document.getElementById('subtitle-display');
            
            function startAudioForSlide(event) {
                const currentSlide = event.currentSlide;
                const audio = currentSlide.querySelector('.slide-audio');
                const subtitleText = currentSlide.querySelector('.slide-subtitle');
                
                // Clear any existing timer
                clearTimeout(slideTimer);
                
                // Stop all audio
                document.querySelectorAll('.slide-audio').forEach(a => {
                    a.pause();
                    a.currentTime = 0;
                });
                
                // Hide subtitles
                subtitleDisplay.classList.remove('visible');
                subtitleDisplay.textContent = '';
                
                // If current slide has audio, play it after delay
                if (audio && subtitleText) {
                    slideTimer = setTimeout(() => {
                        audio.play().catch(() => {});
                        subtitleDisplay.textContent = subtitleText.textContent;
                        subtitleDisplay.classList.add('visible');
                    }, 1000);
                }
            }
            
            // Fires on first load
            Reveal.on('ready', event => {
                startAudioForSlide(event);
            });
            
            // Fires when navigating
            Reveal.on('slidechanged', event => {
                startAudioForSlide(event);
            });
            
            // Start button
            document.getElementById("start-btn").addEventListener("click", () => {
                Reveal.next();
            });
        </script>
	</body>
</html>
